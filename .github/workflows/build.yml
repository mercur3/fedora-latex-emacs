# This file is autogenerated. Do NOT edit this file. Run =./build.py= instead #
###############################################################################

name: Build & Push Fedora LaTeX Emacs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel superseded runs of the same PR (equivalent of Azure's `autoCancel`)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write  # lets GITHUB_TOKEN push to ghcr.io

jobs:
  build:
    name: Building on Fedora ${{ matrix.fedora_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora_version: ['44', '45']
    env:
      FEDORA_VERSION: ${{ matrix.fedora_version }}
      REPOSITORY: mercur3/fedora-latex-emacs
      GHCR_REPOSITORY: ghcr.io/mercur3/fedora-latex-emacs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System info
        run: |
          echo "Building the images on Fedora $FEDORA_VERSION"
          echo "Using $(nproc) threads"

      - name: Build base
        working-directory: build
        run: |
          docker build -f Dockerfile.$FEDORA_VERSION-base \
                       -t $REPOSITORY:$FEDORA_VERSION-base .

      - name: Build medium
        working-directory: build
        run: |
          docker build -f Dockerfile.$FEDORA_VERSION-medium \
                       -t $REPOSITORY:$FEDORA_VERSION-medium .

      - name: Build full
        working-directory: build
        run: |
          docker build -f Dockerfile.$FEDORA_VERSION-full \
                       -t $REPOSITORY:$FEDORA_VERSION-full .

      # Token based authentication: a Docker Hub access token (not the account password)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Token based authentication: the built-in GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image is pushed to both registries at the same time
      - name: Push images
        if: github.event_name != 'pull_request'
        env:
          CONFIGS: "medium full"
        run: |
          pids=()
          for config in $CONFIGS; do
            hub="$REPOSITORY:$FEDORA_VERSION-$config"
            ghcr="$GHCR_REPOSITORY:$FEDORA_VERSION-$config"
            docker tag "$hub" "$ghcr"
            docker push "$hub" & pids+=($!)
            docker push "$ghcr" & pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
